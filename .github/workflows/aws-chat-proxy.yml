# Chat SSE 프록시 아티팩트를 S3에 올리고 EC2에서 systemd로 재시작합니다.
# 사전: infra terraform apply 후 repository Secrets/Variables 등록.
#   Secrets:   AWS_DEPLOY_ROLE_ARN
#   Variables: AWS_REGION, AWS_CHAT_PROXY_ARTIFACT_BUCKET, AWS_CHAT_PROXY_INSTANCE_ID
name: Deploy AWS Chat Proxy

on:
  push:
    branches: [main]
    paths:
      - 'apps/chat-proxy/**'
      - 'packages/sse/**'
      - 'packages/chat/**'
      - 'packages/api/**'
      - 'packages/auth/**'
      - 'packages/core/**'
      - 'packages/events/**'
      - '.github/workflows/aws-chat-proxy.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: aws-chat-proxy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build chat-proxy bundle
        run: pnpm --filter @stream/chat-proxy build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload artifact to S3
        run: |
          aws s3 cp apps/chat-proxy/dist/server.mjs \
            "s3://${{ vars.AWS_CHAT_PROXY_ARTIFACT_BUCKET }}/releases/chat-proxy/server.mjs" \
            --cache-control "no-cache"

      - name: Deploy on EC2 via SSM
        run: |
          set -euo pipefail
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ vars.AWS_CHAT_PROXY_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy stream chat-proxy" \
            --parameters 'commands=["/usr/local/bin/chat-proxy-deploy"]' \
            --query 'Command.CommandId' \
            --output text)
          echo "SSM CommandId=$COMMAND_ID"
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_CHAT_PROXY_INSTANCE_ID }}"
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ vars.AWS_CHAT_PROXY_INSTANCE_ID }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
